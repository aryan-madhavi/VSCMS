version: "3.8"

services:
  # ============================================================================
  # 1. MySQL 8.x Database Service
  # Runs dedicated MySQL container with persistent volume and schema init.
  # ============================================================================
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: vscms-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vscms_db}
      MYSQL_USER: ${MYSQL_USER:-vscms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vscms_secure_pass_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vscms_root_pass_2026}
    ports:
      - "${HOST_MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - vscms-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ============================================================================
  # 2. FastAPI Backend Service
  # Runs Uvicorn ASGI server with SQLAlchemy 2.0 ORM and REST API routes.
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vscms-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-vscms_user}:${MYSQL_PASSWORD:-vscms_secure_pass_2026}@db:3306/${MYSQL_DATABASE:-vscms_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-9f82d1c5a703847e12be8f3a5592cd86b03c8479e01347ba019f5631cda287ef}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - vscms-network

  # ============================================================================
  # 3. React + Vite Frontend Service
  # Runs Vite development server with proxy forwarding to FastAPI container.
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vscms-frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - vscms-network

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  db_data:
    name: vscms_db_data

# ==============================================================================
# Private Bridge Network for Inter-Container Communication
# ==============================================================================
networks:
  vscms-network:
    name: vscms-network
    driver: bridge
